name: Lead finder

on:
  schedule:
    # 5x/day (~every 4.8h), sized to the account-wide 2000 min/month GitHub Free Actions
    # budget shared with other repos on this account - not just per-run cost. Odd minute
    # avoids GitHub's busy top-of-hour queue.
    - cron: "17 0,5,10,14,19 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (do not write to the Sheet)"
        type: boolean
        default: true

permissions:
  contents: write   # lets the job commit state.json so scheduled runs never go stale

concurrency:
  group: lead-finder
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Find leads
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          COMPANIES_HOUSE_API_KEY: ${{ secrets.COMPANIES_HOUSE_API_KEY }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          COMBOS_PER_RUN: "350"
          OVERPASS_BUDGET_SECONDS: "600"
          RUN_BUDGET_SECONDS: "840"
          MAX_SITES_PER_RUN: "800"
          CRAWL_WORKERS: "12"
          MAX_NEW_PER_RUN: "1000"
          GOOGLE_MAX_REQUESTS: "12"
        run: python leadfinder.py

      # The CSV holds scraped business emails, so only keep it as an artifact while the repo is private.
      - name: Upload preview CSV
        id: upload
        if: always() && github.event.repository.private == true
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: lead-preview
          path: output/*.csv
          if-no-files-found: ignore

      - name: Upload preview CSV (retry)
        if: always() && github.event.repository.private == true && steps.upload.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: lead-preview
          path: output/*.csv
          if-no-files-found: ignore
          overwrite: true

      - name: Save rotation state
        run: |
          git config user.name "leadfinder-bot"
          git config user.email "leadfinder-bot@users.noreply.github.com"
          git add state.json || true
          git diff --staged --quiet || (git commit -m "Update lead finder state" && git push)
