name: Lead finder

on:
  schedule:
    # Hourly - plenty of volume already (~40 leads/run => ~1000/day) and no need
    # to push the free OSM Overpass mirrors any harder than that. Repo is public
    # now so Actions minutes aren't the constraint; this is just picked for
    # steady, reliable volume without extra rate-limit risk.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (do not write to the Sheet)"
        type: boolean
        default: true

permissions:
  contents: write   # lets the job commit state.json so scheduled runs never go stale

concurrency:
  group: lead-finder
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # A free local copy of the UK OpenStreetMap data (Geofabrik), rebuilt about once a week and cached.
      # The public Overpass servers are often down for hours, so leadfinder.py searches this copy first
      # and only asks Overpass for towns that are not in it (e.g. Northern Ireland). If the build fails
      # the run carries on with the last cached copy, or with Overpass alone.
      - name: Map data cache key (one per week)
        id: week
        run: echo "key=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Restore map data
        id: osm_cache
        uses: actions/cache/restore@v4
        with:
          path: osm_extract
          key: osm-extract-${{ steps.week.outputs.key }}
          restore-keys: |
            osm-extract-

      - name: Build map data
        id: osm_build
        if: steps.osm_cache.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 20
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool
          bash tools/build_osm_extract.sh osm_extract

      - name: Save map data
        if: steps.osm_build.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: osm_extract
          key: osm-extract-${{ steps.week.outputs.key }}

      - name: Find leads
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          COMPANIES_HOUSE_API_KEY: ${{ secrets.COMPANIES_HOUSE_API_KEY }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          COMBOS_PER_RUN: "350"
          OVERPASS_BUDGET_SECONDS: "780"
          RUN_BUDGET_SECONDS: "1020"
          MAX_SITES_PER_RUN: "800"
          CRAWL_WORKERS: "12"
          MAX_NEW_PER_RUN: "1000"
          GOOGLE_MAX_REQUESTS: "12"
        run: python leadfinder.py

      # The CSV holds scraped business emails, so only keep it as an artifact while the repo is private.
      - name: Upload preview CSV
        id: upload
        if: always() && github.event.repository.private == true
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: lead-preview
          path: output/*.csv
          if-no-files-found: ignore

      - name: Upload preview CSV (retry)
        if: always() && github.event.repository.private == true && steps.upload.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: lead-preview
          path: output/*.csv
          if-no-files-found: ignore
          overwrite: true

      - name: Save rotation state
        run: |
          git config user.name "leadfinder-bot"
          git config user.email "leadfinder-bot@users.noreply.github.com"
          git add state.json || true
          git diff --staged --quiet || (git commit -m "Update lead finder state" && git push)
